name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: backend (cargo check + test)
    runs-on: ubuntu-latest

    # The suite is mostly SQL, so most of it is meaningless without Postgres.
    # `test_support::pool` fails rather than skips when DATABASE_URL is missing
    # or unreachable, so a runner without this service cannot report green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mrr_fantasy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mrr_fantasy_test

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # `uuid_generate_v4()` comes from uuid-ossp, which the migrations assume
      # is already present.
      - name: Enable uuid-ossp
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: cargo check
        working-directory: backend
        run: cargo check --all-targets

      # The same code the server runs at boot, stopping before it serves. Most
      # of the suite asserts against the seeded roster, so a migrated-but-empty
      # database fails 23 tests.
      - name: Migrate and seed
        working-directory: backend
        run: cargo run -- --migrate-and-seed

      - name: cargo test
        working-directory: backend
        run: cargo test

  frontend:
    name: frontend (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Reported, not enforced. Three pre-existing errors are all
      # "setState synchronously within an effect", and at least `nav.tsx`
      # is correct as written: it reads localStorage, which cannot run during
      # render without breaking hydration. Satisfying the rule there would
      # introduce a real bug to silence a heuristic.
      #
      # Gating on this today would make CI red from its first run, which is how
      # a check stops being read. Fix the three, then drop continue-on-error.
      - name: Lint (non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm run lint

  deploy-backend:
    name: deploy backend to Fly
    runs-on: ubuntu-latest

    # Only the real thing: never from a pull request, and never before the
    # tests that would have caught it. `needs` is what makes this a pipeline
    # rather than two things that happen to run — a red suite stops the deploy.
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Serialise deploys. Two overlapping `fly deploy` runs race each other's
    # machines, and this app applies migrations at boot, so they would race
    # those too. Later commit wins; the earlier one is cancelled before it
    # starts, not halfway through.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false

    # Add required reviewers to the `production` environment in repository
    # settings to make this click-to-approve. Leave it with none and it deploys
    # on merge. The workflow is the same either way — the choice lives in
    # settings, where it can be changed without a commit.
    environment:
      name: production
      url: https://mrr-fantasy-api.fly.dev

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # `--remote-only` builds on Fly's builder rather than the runner, which
      # is what the Dockerfile expects and keeps the image out of the runner's
      # disk budget.
      - name: fly deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Check it came back up
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' https://mrr-fantasy-api.fly.dev/healthz || true)
            if [ "$code" = "200" ]; then
              echo "healthz: 200"
              exit 0
            fi
            echo "healthz: ${code:-no response} (attempt $i)"
            sleep 5
          done
          echo "::error::Backend did not return 200 from /healthz after deploying."
          exit 1
