name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: backend (cargo check + test)
    runs-on: ubuntu-latest

    # The suite is mostly SQL, so most of it is meaningless without Postgres.
    # `test_support::pool` fails rather than skips when DATABASE_URL is missing
    # or unreachable, so a runner without this service cannot report green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mrr_fantasy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mrr_fantasy_test

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # `uuid_generate_v4()` comes from uuid-ossp, which the migrations assume
      # is already present.
      - name: Enable uuid-ossp
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: cargo check
        working-directory: backend
        run: cargo check --all-targets

      # The same code the server runs at boot, stopping before it serves. Most
      # of the suite asserts against the seeded roster, so a migrated-but-empty
      # database fails 23 tests.
      - name: Migrate and seed
        working-directory: backend
        run: cargo run -- --migrate-and-seed

      - name: cargo test
        working-directory: backend
        run: cargo test

  frontend:
    name: frontend (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Reported, not enforced. Three pre-existing errors are all
      # "setState synchronously within an effect", and at least `nav.tsx`
      # is correct as written: it reads localStorage, which cannot run during
      # render without breaking hydration. Satisfying the rule there would
      # introduce a real bug to silence a heuristic.
      #
      # Gating on this today would make CI red from its first run, which is how
      # a check stops being read. Fix the three, then drop continue-on-error.
      - name: Lint (non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm run lint
